name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # TMPDIR must point to a directory that allows executing the
      # fake shell scripts written by `makeExecutable` in cli-locator
      # tests. On some CI runners /tmp is mounted `noexec`, which would
      # make the tests fail with "unparseable version" (the spawn
      # succeeds but the script never runs). The GitHub Actions
      # ${{ runner.temp }} directory is a writable, executable tmp
      # space allocated per-job.
      - name: Set TMPDIR
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint (oxlint)
        run: bun run lint
